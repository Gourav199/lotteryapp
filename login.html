<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a2744">
  <title>Sign In | Lottery Number Tools</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #1a2744;
      --navy-deep: #10192e;
      --red: #b42318;
      --gold: #b6893b;
      --paper: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #6b6258;
      --line: #e6dcc8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: var(--paper);
      background-image: radial-gradient(#d9d0c0 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    .login {
      width: min(100%, 420px);
      overflow: hidden;
      background: var(--card);
      border: 2px solid var(--navy);
      border-radius: 8px;
      box-shadow: 9px 9px 0 rgba(26, 39, 68, .12);
      animation: arrive .45s ease-out both;
    }
    .masthead {
      padding: 25px 28px 22px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
      border-bottom: 4px solid var(--gold);
      color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font: 700 17px/1 Georgia, serif;
    }
    .eyebrow {
      margin: 0 0 3px;
      color: #e9c986;
      font: 700 11px/1.3 Arial, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 23px; line-height: 1.15; }
    .form-body { padding: 27px 28px 24px; }
    .intro { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
    label {
      display: block;
      margin: 0 0 7px;
      font: 700 13px/1.4 Arial, sans-serif;
      color: var(--navy);
    }
    input {
      width: 100%;
      min-height: 46px;
      margin: 0 0 17px;
      padding: 10px 12px;
      border: 1px solid #b9b09f;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: 16px/1.4 Arial, sans-serif;
    }
    input:focus-visible { outline: 3px solid rgba(182,137,59,.45); border-color: var(--gold); }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 2px;
      border: 0;
      border-radius: 4px;
      background: var(--red);
      color: #fff;
      font: 700 15px/1 Arial, sans-serif;
      cursor: pointer;
      transition: background-color .16s ease, transform .16s ease;
    }
    button:hover { background: #8c1c14; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .message {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-left: 3px solid var(--red);
      background: #fdecea;
      color: #8c1c14;
      font: 14px/1.4 Arial, sans-serif;
    }
    .message[hidden] { display: none; }
    .fine-print {
      margin: 19px 0 0;
      color: var(--muted);
      font: 12px/1.5 Arial, sans-serif;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .masthead { padding: 22px 21px 19px; }
      .form-body { padding: 23px 21px 21px; }
    }
  </style>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="login">
    <header class="masthead">
      <div class="brand">
        <span class="mark" aria-hidden="true">L</span>
        <div>
          <p class="eyebrow">Lottery Number Tools</p>
          <h1>Welcome back</h1>
        </div>
      </div>
    </header>
    <div class="form-body">
      <p class="intro">Sign in to open your number analysis workspace.</p>
      <form id="login-form">
        <p class="message" id="login-message" role="alert" aria-live="polite" hidden></p>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <p class="fine-print">This sign-in is stored only in this browser session.</p>
    </div>
  </main>
</body>
</html>
